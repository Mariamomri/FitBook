<h1>Cours</h1>

@for (unCours of cours(); track unCours.id) {
  <div>
    <h2>{{ unCours.titre }}</h2>
    <p>{{ unCours.description }}</p>
    <p>Niveau : {{ unCours.niveau }}</p>
    <p>Capacité : {{ unCours.capacite }} places</p>
    <p>Prix : {{ unCours.prix }} €</p>
  </div>
} @empty {
  <p>Aucun cours.</p>
}
