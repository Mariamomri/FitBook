<h1>Activités</h1>

@for (unCours of cours(); track unCours.id) {
  <div>
    <p>{{ unCours.activiteNom }} · {{ unCours.niveau }}</p>
    <h2>{{ unCours.titre }}</h2>
    <p>{{ unCours.salleNom }}</p>
    <p>{{ unCours.prix }} €</p>
    <a [routerLink]="['/activites', unCours.id]">Voir le détail</a>
  </div>
} @empty {
  <p>Aucune activité.</p>
}
