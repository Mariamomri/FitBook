<!doctype html>
<html lang="fr" data-theme="dark" data-accent="vert">
  <head>
    <meta charset="utf-8" />
    <!-- Met le mode clair tout de suite pour éviter un flash sombre -->
    <script>
      try {
        if (localStorage.getItem('mode') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <title>FitBook — Salles, cours et coachs</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Polices de la maquette : Barlow Condensed (titres) et Inter (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800;1,900&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icônes Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
